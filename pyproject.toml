[project]
name = "sparse-edits"
version = "0.1.0"
description = "Detection of sparse AI edits in human text (Stat 236 project)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy>=1.11",
    "pandas",
    "pyarrow",
    "pyyaml",
    "tqdm",
    "datasets",
    "nltk",
    "wtpsplit==2.2.2",
    "ftfy==6.3.1",
    "rapidfuzz",
    "openai",
    "gdown",
    "python-dotenv",
    "torch",
    "transformers>=5.20",
    "accelerate",
    "sentence-transformers",
    "scikit-learn",
    "matplotlib",
    "anthropic>=2.3.0",
    "peft>=0.21.2",
    "sentencepiece>=0.2.2",
    "protobuf>=7.36.2",
    "torchvision>=0.29.2",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparse_edits"]

[tool.pytest.ini_options]
markers = ["slow: downloads a model (deselect with -m 'not slow')"]
